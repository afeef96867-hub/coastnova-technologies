apiVersion: apps/v1
kind: Deployment
metadata:
  name: coastnova-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coastnova
  template:
    metadata:
      labels:
        app: coastnova
    spec:
      containers:
        - name: coastnova
          image: coastnova-website:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80